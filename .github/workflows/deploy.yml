name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda adalah master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project (Vite + React)
        run: npm run build
        
      # Vite secara otomatis akan menyalin semua file di folder /public (termasuk .htaccess dan file PHP) ke dalam folder /dist

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Hanya mengupload hasil build
          server-dir: ./public_html/ # Sesuaikan jika Anda menggunakan subdomain (misal: ./domains/domainanda.com/public_html/)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
